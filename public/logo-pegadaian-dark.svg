<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 36" fill="none" width="170" height="36">
  <!-- Pegadaian Three Intersecting Circles Brandmark -->
  <g id="pegadaian-mark">
    <!-- Circle 1 (Lime) -->
    <circle cx="14" cy="18" r="11" fill="#BFD730"/>
    <!-- Circle 2 (Grass Green) -->
    <circle cx="25" cy="18" r="11" fill="#72BF44" fill-opacity="0.95"/>
    <!-- Circle 3 (Dark Green) -->
    <circle cx="37" cy="18" r="12" fill="#00AB4E"/>
    <!-- Scales of Justice (Timbangan) in White inside Circle 3 -->
    <g transform="translate(37, 18) scale(0.62) translate(-12, -12)">
      <!-- Beam -->
      <path d="M4 11h16" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <!-- Center pivot -->
      <circle cx="12" cy="11" r="1.5" fill="white"/>
      <path d="M12 7v4" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Left Pan -->
      <path d="M4 11l-2 5h8l-2-5" stroke="white" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
      <path d="M2 16a4 4 0 0 0 8 0" stroke="white" stroke-width="1.3" fill="white"/>
      <!-- Right Pan -->
      <path d="M20 11l-2 5h8l-2-5" stroke="white" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
      <path d="M18 16a4 4 0 0 0 8 0" stroke="white" stroke-width="1.3" fill="white"/>
    </g>
  </g>
  <!-- Wordmark "Pegadaian" in dark green #013428 -->
  <text x="56" y="24" fill="#013428" font-family="'Geist', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3px">Pegadaian</text>
</svg>
