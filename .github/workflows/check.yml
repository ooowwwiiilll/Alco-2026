name: Check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production -- --project chromium
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore,storage --project demo-alco "npm run test:rules"
